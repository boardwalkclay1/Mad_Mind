<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mad Mind – Create Account</title>
  <link rel="stylesheet" href="madmind.css" />
</head>
<body>
  <div class="page-shell">
    <div class="mad-card glow-red">
      <div class="mad-title">Join Mad Mind</div>

      <div class="mad-field">
        <label class="mad-label" for="ca-username">Username</label>
        <input id="ca-username" class="mad-input" type="text" />
      </div>

      <div class="mad-field">
        <label class="mad-label" for="ca-email">Email</label>
        <input id="ca-email" class="mad-input" type="email" />
      </div>

      <div class="mad-field">
        <label class="mad-label" for="ca-password">Password</label>
        <input id="ca-password" class="mad-input" type="password" />
      </div>

      <div class="mad-field">
        <label class="mad-label" for="ca-style">Travel style</label>
        <select id="ca-style" class="mad-input">
          <option value="">Select style</option>
          <option value="van">Van</option>
          <option value="car">Car</option>
          <option value="rv">RV</option>
          <option value="backpack">Backpack</option>
          <option value="bike">Bike</option>
          <option value="other">Other</option>
        </select>
      </div>

      <button id="ca-create-btn" class="mad-btn mad-btn-primary">Create Nomad Profile</button>

      <div class="mad-subtext">
        Already in the network? <a href="login.html">Log in</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { initBubbles } from './bubbles.js';
    initBubbles({ count: 12, clickable: true });

    function getUsers() {
      return JSON.parse(localStorage.getItem("mm_users") || "[]");
    }

    function saveUsers(users) {
      localStorage.setItem("mm_users", JSON.stringify(users));
    }

    document.getElementById("ca-create-btn").addEventListener("click", () => {
      const username = document.getElementById("ca-username").value.trim();
      const email = document.getElementById("ca-email").value.trim();
      const password = document.getElementById("ca-password").value;
      const style = document.getElementById("ca-style").value;

      if (!username || !email || !password) {
        alert("Username, email, and password are required.");
        return;
      }

      const users = getUsers();
      if (users.some(u => u.username === username)) {
        alert("That username is already taken.");
        return;
      }

      const id = "user_" + Date.now();
      const newUser = {
        id,
        username,
        email,
        password,
        style,
        createdAt: new Date().toISOString(),
        // Profile basics
        bio: "",
        currentCity: "",
        services: [],
        media: [],
        visitedCities: [],
        journalEntries: []
      };

      users.push(newUser);
      saveUsers(users);
      localStorage.setItem("mm_current_user_id", id);

      // TODO: Later: send to /api/register on Cloudflare Worker.
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
