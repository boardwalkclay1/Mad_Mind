<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mad Mind – Messages</title>
  <link rel="stylesheet" href="madmind.css" />
</head>
<body>
  <div class="page-shell">
    <header class="mad-topbar">
      <div class="mad-topbar-left">
        <div class="mad-avatar">💬</div>
        <div>
          <div class="mad-topbar-title">Messages</div>
          <div style="font-size:0.7rem;color:rgba(249,243,229,.8);">
            Talk directly to other nomads
          </div>
        </div>
      </div>
      <div class="mad-topbar-right">
        <button class="mad-icon-btn" onclick="window.location.href='dashboard.html'">⌂</button>
      </div>
    </header>

    <div class="scroll-panel" style="display:flex;flex-direction:column;gap:10px;">
      <section>
        <h2 style="font-size:0.9rem;margin-bottom:4px;color:var(--gold-soft);letter-spacing:0.14em;text-transform:uppercase;">
          Threads
        </h2>
        <div id="thread-list" style="margin-bottom:10px;"></div>
      </section>

      <section style="border-top:1px solid rgba(245,197,66,.4);padding-top:8px;">
        <h2 style="font-size:0.9rem;margin-bottom:4px;color:var(--gold-soft);letter-spacing:0.14em;text-transform:uppercase;">
          Conversation
        </h2>
        <div id="message-thread" style="border:1px solid rgba(245,197,66,.5);border-radius:12px;padding:8px;max-height:38vh;overflow-y:auto;margin-bottom:8px;background:#090909;"></div>

        <div>
          <textarea id="msg-input" class="mad-input" rows="2" placeholder="Say something helpful, kind, or direct..."></textarea>
          <button id="msg-send-btn" class="mad-btn mad-btn-primary" style="margin-top:6px;width:auto;min-width:120px;">
            Send
          </button>
        </div>
      </section>
    </div>
  </div>

  <nav class="mad-bottom-nav">
    <button onclick="window.location.href='dashboard.html'">Home</button>
    <button onclick="window.location.href='map.html'">Map</button>
    <button onclick="window.location.href='profile.html'">Profile</button>
  </nav>

  <script type="module">
    import { initBubbles } from './bubbles.js';
    initBubbles({ count: 10, clickable: false });

    function getUsers() {
      return JSON.parse(localStorage.getItem("mm_users") || "[]");
    }
    function getMessages() {
      return JSON.parse(localStorage.getItem("mm_messages") || "[]");
    }
    function saveMessages(msgs) {
      localStorage.setItem("mm_messages", JSON.stringify(msgs));
    }

    const currentId = localStorage.getItem("mm_current_user_id");
    if (!currentId) {
      window.location.href = "login.html";
    }
    const users = getUsers();
    const me = users.find(u => u.id === currentId);
    if (!me) window.location.href = "login.html";

    const threadListEl = document.getElementById("thread-list");
    const threadEl = document.getElementById("message-thread");
    const msgInput = document.getElementById("msg-input");
    const sendBtn = document.getElementById("msg-send-btn");

    let currentPeerId = null;

    function uniqueContacts(messages) {
      const ids = new Set();
      messages.forEach(m => {
        if (m.from === currentId) ids.add(m.to);
        if (m.to === currentId) ids.add(m.from);
      });
      return [...ids];
    }

    function renderThreads() {
      const messages = getMessages();
      const contacts = uniqueContacts(messages);
      threadListEl.innerHTML = "";
      if (!contacts.length) {
        threadListEl.innerHTML = '<p style="font-size:0.8rem;color:rgba(249,243,229,.7);">No conversations yet.</p>';
        return;
      }
      contacts.forEach(cid => {
        const u = users.find(x => x.id === cid);
        const div = document.createElement("div");
        div.style.border = "1px solid rgba(245,197,66,.5)";
        div.style.borderRadius = "10px";
        div.style.padding = "6px 8px";
        div.style.marginBottom = "5px";
        div.style.cursor = "pointer";
        div.innerHTML = `
          <div style="font-size:0.9rem;color:var(--gold-soft);font-weight:600;">@${u ? u.username : "unknown"}</div>
          <div style="font-size:0.72rem;color:rgba(249,243,229,.75);margin-top:2px;">Tap to open chat</div>
        `;
        div.addEventListener("click", () => {
          currentPeerId = cid;
          renderMessages();
        });
        threadListEl.appendChild(div);
      });
    }

    function renderMessages() {
      threadEl.innerHTML = "";
      if (!currentPeerId) {
        threadEl.innerHTML = '<p style="font-size:0.8rem;color:rgba(249,243,229,.7);">Select a thread above.</p>';
        return;
      }
      const messages = getMessages().filter(m =>
        (m.from === currentId && m.to === currentPeerId) ||
        (m.to === currentId && m.from === currentPeerId)
      ).sort((a, b) => new Date(a.time) - new Date(b.time));

      if (!messages.length) {
        threadEl.innerHTML = '<p style="font-size:0.8rem;color:rgba(249,243,229,.7);">No messages yet. Start the conversation.</p>';
        return;
      }

      messages.forEach(m => {
        const div = document.createElement("div");
        div.style.marginBottom = "6px";
        div.style.display = "flex";
        div.style.justifyContent = m.from === currentId ? "flex-end" : "flex-start";
        const bubble = document.createElement("div");
        bubble.style.maxWidth = "75%";
        bubble.style.padding = "6px 8px";
        bubble.style.borderRadius = "10px";
        bubble.style.fontSize = "0.8rem";
        bubble.style.lineHeight = "1.3";
        if (m.from === currentId) {
          bubble.style.background = "linear-gradient(135deg,var(--gold),#ffdd77)";
          bubble.style.color = "#1a1200";
        } else {
          bubble.style.background = "#1a1a1a";
          bubble.style.border = "1px solid rgba(245,197,66,.4)";
          bubble.style.color = "#f9f3e5";
        }
        bubble.textContent = m.text;
        div.appendChild(bubble);
        threadEl.appendChild(div);
      });

      threadEl.scrollTop = threadEl.scrollHeight;
    }

    sendBtn.addEventListener("click", () => {
      if (!currentPeerId) {
        alert("Select a conversation first.");
        return;
      }
      const text = msgInput.value.trim();
      if (!text) return;
      const msgs = getMessages();
      msgs.push({
        id: "msg_" + Date.now(),
        from: currentId,
        to: currentPeerId,
        text,
        time: new Date().toISOString()
      });
      saveMessages(msgs);
      msgInput.value = "";
      renderMessages();
      renderThreads();
      // TODO: later POST to /api/messages
    });

    // For now, create a demo contact if none exist
    (function seedDemoIfNeeded() {
      const msgs = getMessages();
      if (!msgs.length && users.length > 1) {
        const peer = users.find(u => u.id !== currentId);
        if (peer) {
          const demo = {
            id: "msg_demo",
            from: peer.id,
            to: currentId,
            text: "Welcome to Mad Mind. See you on the road.",
            time: new Date().toISOString()
          };
          msgs.push(demo);
          saveMessages(msgs);
        }
      }
    })();

    renderThreads();
    renderMessages();
  </script>
</body>
</html>
