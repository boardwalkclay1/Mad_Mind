<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mad Mind – Login</title>
  <link rel="stylesheet" href="madmind.css" />
</head>
<body>
  <div class="page-shell">
    <div class="mad-card glow-gold">
      <div class="mad-title">Mad Mind</div>
      <p style="text-align:center;font-size:0.85rem;margin-bottom:18px;">
        Nomad network • Trades • Survival map
      </p>

      <div class="mad-field">
        <label class="mad-label" for="login-identifier">Email or username</label>
        <input id="login-identifier" class="mad-input" type="text" autocomplete="username" />
      </div>

      <div class="mad-field">
        <label class="mad-label" for="login-password">Password</label>
        <input id="login-password" class="mad-input" type="password" autocomplete="current-password" />
      </div>

      <button id="login-btn" class="mad-btn mad-btn-primary">Enter Mad Mind</button>
      <button id="guest-btn" class="mad-btn mad-btn-secondary">Continue as guest (map only)</button>

      <div class="mad-subtext">
        No account yet? <a href="create-account.html">Create one</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { initBubbles } from './bubbles.js';
    initBubbles({ count: 14, clickable: true });

    // Local storage "auth" for prototype
    function getUsers() {
      return JSON.parse(localStorage.getItem("mm_users") || "[]");
    }

    document.getElementById("login-btn").addEventListener("click", () => {
      const id = document.getElementById("login-identifier").value.trim();
      const pw = document.getElementById("login-password").value;
      if (!id || !pw) {
        alert("Enter both identifier and password.");
        return;
      }

      const users = getUsers();
      const user = users.find(
        u => (u.email === id || u.username === id) && u.password === pw
      );

      if (!user) {
        alert("No matching nomad found. Check your details.");
        return;
      }

      localStorage.setItem("mm_current_user_id", user.id);
      // TODO: Replace with Cloudflare Worker /api/login call later.
      window.location.href = "dashboard.html";
    });

    document.getElementById("guest-btn").addEventListener("click", () => {
      localStorage.removeItem("mm_current_user_id");
      window.location.href = "map.html";
    });
  </script>
</body>
</html>
